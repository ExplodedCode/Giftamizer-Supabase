# Serves the auth emails (volumes/auth/templates) to the auth service, which can only load
# its templates over HTTP. Included in Kong's nginx config (see docker-compose.yml).
#
# Port 8088 isn't published, so this is only reachable inside the compose network. It must
# answer 404 for anything else: whatever it returns with a 200 is sent as the email.
server {
    listen 8088;
    access_log off;

    root /home/kong/email-templates;

    location / {
        default_type text/html;
        try_files $uri =404;
    }
}
